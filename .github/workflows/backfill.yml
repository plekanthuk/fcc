name: FCC Historical Backfill

# Один "тік" = один день. Скрипт сам питає WP (enabled? який рік? яка
# найраніша дата вже є?) і або сканує рівно один день, або миттєво виходить,
# якщо бекфіл вимкнено/завершено. Керується вимикачем "Enable backfill cron"
# в адмінці (FCC Import -> Scan -> Historical backfill), не цим файлом.
#
# GitHub Actions' власний `schedule` НЕ надійний для щільного темпу — реально
# затримує кожен запуск на 20-80+ хв незалежно від заданого cron-інтервалу
# (задокументована особливість GH Actions при навантаженні). Тому основний
# драйвер темпу — сам job: після кожного тіку, якщо є що сканувати далі, він
# одразу перетригерює наступний запуск через API. `schedule` тут лишається
# лише рідкісною підстраховкою (раз/год) на випадок, якщо ланцюжок обірветься
# (напр. після невдалого запуску).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

# GitHub runs different workflow_dispatch/schedule triggers of the SAME
# workflow in PARALLEL by default. Since the self-chain fires a fresh
# dispatch after every tick, and the hourly schedule / manual runs can land
# around the same time, two ticks could both read "earliest completed day"
# before either had written its own — and both pick the SAME day to scan
# (harmless thanks to idempotent upserts, but wastes a full run). This
# forces at most one tick at a time; a second trigger queues and starts
# only after the first commits its result, so it naturally picks the next
# day instead of repeating one.
concurrency:
  group: fcc-backfill
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Run one backfill tick
        id: tick
        run: python fetch_fcc.py --backfill
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_API_KEY: ${{ secrets.WP_API_KEY }}

      - name: Chain next tick immediately
        if: steps.tick.outputs.backfill_status == 'scanned' || steps.tick.outputs.backfill_status == 'error'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/backfill.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
